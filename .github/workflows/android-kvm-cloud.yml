name: DroidCloud KVM Android Server

on:
  workflow_dispatch:
    inputs:
      android_api:
        description: 'Android API Level'
        required: false
        default: '34'
      session_id:
        description: 'Control Plane Session ID'
        required: false
        default: 'default-session'
      callback_url:
        description: 'Control Plane Callback URL'
        required: false
        default: 'https://ais-dev-h2enyvld4mx3s4aqejob4w-340482346090.asia-southeast1.run.app'
      restore_apks:
        description: 'Space-separated APK URLs to auto-install on boot'
        required: false
        default: ''
      initial_lat:
        description: 'Initial GPS Latitude'
        required: false
        default: '23.8103'
      initial_lon:
        description: 'Initial GPS Longitude'
        required: false
        default: '90.4125'

permissions:
  contents: write
  actions: write

concurrency:
  group: droidcloud-kvm-instance
  cancel-in-progress: true

jobs:
  cloud-android-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Enable Hardware KVM & Start Instant Tunnels (15s Fast-Connect)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
        run: |
          echo "1. Configuring /dev/kvm hardware virtualization..."
          sudo chmod 666 /dev/kvm
          sudo chown root:kvm /dev/kvm

          echo "2. Installing cloudflared static binary..."
          sudo curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          echo "3. Starting Ultra-Fast ADB Bridge v3 (JPEG Turbo Stream + GPS + APK/ZIP + Permanent Backup) on :8081..."
          cat << 'EOF' > adb_bridge.mjs
          import http from 'node:http';
          import { exec, execFile, spawn } from 'node:child_process';
          import { promisify } from 'node:util';
          import fs from 'node:fs';

          const execAsync = promisify(exec);
          const PORT = 8081;

          let latestFrame = null;
          let latestMime = 'image/jpeg';
          let latestFrameTime = 0;
          let isCapturing = false;
          let currentGps = {
            lat: Number(process.env.INITIAL_LAT || 23.8103),
            lon: Number(process.env.INITIAL_LON || 90.4125),
            alt: 15,
            updatedAt: Date.now()
          };

          function captureNextFrame() {
            if (isCapturing) return;
            isCapturing = true;
            execFile('docker', ['exec', 'android-kvm', 'adb', 'exec-out', 'screencap', '-p'], {
              encoding: 'buffer',
              maxBuffer: 25 * 1024 * 1024,
              timeout: 2500
            }, (err, pngBuf) => {
              if (err || !pngBuf || pngBuf.length < 800) {
                isCapturing = false;
                return;
              }
              const ff = spawn('ffmpeg', [
                '-loglevel', 'quiet',
                '-i', 'pipe:0',
                '-vf', 'scale=720:-1',
                '-frames:v', '1',
                '-q:v', '6',
                '-f', 'mjpeg',
                'pipe:1'
              ]);
              const chunks = [];
              const timer = setTimeout(() => {
                try { ff.kill('SIGKILL'); } catch {}
              }, 1800);
              ff.stdout.on('data', (d) => chunks.push(d));
              ff.on('close', (code) => {
                clearTimeout(timer);
                isCapturing = false;
                const jpgBuf = Buffer.concat(chunks);
                if (code === 0 && jpgBuf.length > 500) {
                  latestFrame = jpgBuf;
                  latestMime = 'image/jpeg';
                  latestFrameTime = Date.now();
                } else {
                  latestFrame = pngBuf;
                  latestMime = 'image/png';
                  latestFrameTime = Date.now();
                }
              });
              ff.on('error', () => {
                clearTimeout(timer);
                isCapturing = false;
                latestFrame = pngBuf;
                latestMime = 'image/png';
                latestFrameTime = Date.now();
              });
              try {
                ff.stdin.write(pngBuf);
                ff.stdin.end();
              } catch {
                isCapturing = false;
              }
            });
          }

          setInterval(captureNextFrame, 260);

          async function runAdb(cmd) {
            return execAsync(`docker exec android-kvm adb ${cmd}`, { maxBuffer: 50 * 1024 * 1024 });
          }

          async function applyGpsToEmulator(lat, lon, alt = 15) {
            const cleanLat = Number(lat);
            const cleanLon = Number(lon);
            const cleanAlt = Number(alt || 15);
            if (Number.isNaN(cleanLat) || Number.isNaN(cleanLon)) {
              throw new Error('Invalid latitude or longitude');
            }
            currentGps = { lat: cleanLat, lon: cleanLon, alt: cleanAlt, updatedAt: Date.now() };
            // 1. Official QEMU/Android Emulator hardware GPS fix (note: longitude first, then latitude)
            await runAdb(`emu geo fix ${cleanLon} ${cleanLat} ${cleanAlt}`).catch(() => {});
            // 2. Ensure High Accuracy Location Mode is enabled in Android Settings
            await runAdb('shell "settings put secure location_mode 3"').catch(() => {});
            // 3. Persist inside Android /sdcard/
            await runAdb(`shell "echo '{\"lat\":${cleanLat},\"lon\":${cleanLon}}' > /sdcard/gps_location.json"`).catch(() => {});
            return currentGps;
          }

          const server = http.createServer(async (req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, POST, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', 'Content-Type, Authorization');
            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              res.end();
              return;
            }

            const url = new URL(req.url || '/', `http://localhost:${PORT}`);

            try {
              if (url.pathname === '/health') {
                let stage = 'pulling_image';
                try {
                  stage = fs.readFileSync('/tmp/droidcloud_stage.txt', 'utf8').trim();
                } catch {}
                const { stdout } = await runAdb('devices').catch(() => ({ stdout: '' }));
                const bootRes = await runAdb('shell getprop sys.boot_completed').catch(() => ({ stdout: '0' }));
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({
                  ok: true,
                  stage,
                  devices: stdout.trim(),
                  bootCompleted: bootRes.stdout.trim() === '1',
                  androidVersion: '14',
                  hasCachedFrame: Boolean(latestFrame),
                  gps: currentGps,
                  timestamp: Date.now()
                }));
                return;
              }

              if (url.pathname === '/screencap') {
                if (latestFrame && Date.now() - latestFrameTime < 2000) {
                  res.writeHead(200, {
                    'Content-Type': latestMime,
                    'Cache-Control': 'no-store'
                  });
                  res.end(latestFrame);
                  captureNextFrame();
                  return;
                }
                execFile('docker', ['exec', 'android-kvm', 'adb', 'exec-out', 'screencap', '-p'], {
                  encoding: 'buffer',
                  maxBuffer: 25 * 1024 * 1024,
                  timeout: 2500
                }, (err, stdout) => {
                  if (err || !stdout || stdout.length < 100) {
                    res.writeHead(503, { 'Content-Type': 'application/json' });
                    res.end(JSON.stringify({ ok: false, error: 'Android KVM framebuffer warming up...' }));
                    return;
                  }
                  latestFrame = stdout;
                  latestMime = 'image/png';
                  latestFrameTime = Date.now();
                  res.writeHead(200, {
                    'Content-Type': 'image/png',
                    'Cache-Control': 'no-store'
                  });
                  res.end(stdout);
                  captureNextFrame();
                });
                return;
              }

              if (req.method === 'POST') {
                let body = '';
                for await (const chunk of req) body += chunk;
                const payload = body ? JSON.parse(body) : {};

                if (url.pathname === '/input') {
                  const { type, x, y, x2, y2, duration = 220, keycode, text } = payload;
                  if (type === 'tap') {
                    await runAdb(`shell input tap ${Math.round(x)} ${Math.round(y)}`);
                  } else if (type === 'swipe') {
                    await runAdb(`shell input swipe ${Math.round(x)} ${Math.round(y)} ${Math.round(x2)} ${Math.round(y2)} ${Math.round(duration)}`);
                  } else if (type === 'keyevent') {
                    await runAdb(`shell input keyevent ${Number(keycode)}`);
                  } else if (type === 'text' && text) {
                    const escaped = String(text).replace(/ /g, '%s').replace(/['"\\`$&|;<>()]/g, '');
                    await runAdb(`shell input text "${escaped}"`);
                  }
                  setTimeout(captureNextFrame, 80);
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ ok: true }));
                  return;
                }

                if (url.pathname === '/gps') {
                  const { lat, lon, alt = 15 } = payload;
                  const updated = await applyGpsToEmulator(lat, lon, alt);
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ ok: true, gps: updated }));
                  return;
                }

                if (url.pathname === '/camera-upload') {
                  const { imageBase64, openInGallery } = payload;
                  if (!imageBase64) throw new Error('Missing imageBase64');
                  const cleanB64 = String(imageBase64).replace(/^data:image\/\w+;base64,/, '');
                  const buf = Buffer.from(cleanB64, 'base64');
                  fs.writeFileSync('/tmp/vivo_camera.jpg', buf);
                  const tsName = `IMG_VIVO_${Date.now()}.jpg`;
                  await runAdb('shell "mkdir -p /sdcard/DCIM/Camera /sdcard/Pictures"');
                  await execAsync('docker cp /tmp/vivo_camera.jpg android-kvm:/sdcard/DCIM/Camera/IMG_VIVO_LIVE.jpg');
                  await execAsync(`docker cp /tmp/vivo_camera.jpg android-kvm:/sdcard/DCIM/Camera/${tsName}`);
                  await runAdb('shell "am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/DCIM/Camera/IMG_VIVO_LIVE.jpg"');
                  await runAdb(`shell "am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/DCIM/Camera/${tsName}"`);
                  if (openInGallery) {
                    await runAdb('shell "am start -a android.intent.action.VIEW -t image/jpeg -d content://media/external/images/media"').catch(() => {});
                  }
                  setTimeout(captureNextFrame, 150);
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({
                    ok: true,
                    savedPath: `/sdcard/DCIM/Camera/${tsName}`,
                    livePath: '/sdcard/DCIM/Camera/IMG_VIVO_LIVE.jpg'
                  }));
                  return;
                }

                if (url.pathname === '/install-url') {
                  const apkUrl = String(payload.apkUrl || '');
                  if (!apkUrl.startsWith('http')) throw new Error('Invalid URL');
                  const isZip = apkUrl.toLowerCase().endsWith('.zip');
                  if (isZip) {
                    await execAsync('rm -rf /tmp/zip_extract && mkdir -p /tmp/zip_extract');
                    await execAsync(`curl -L -s -o /tmp/remote_bundle.zip "${apkUrl}" && unzip -o /tmp/remote_bundle.zip -d /tmp/zip_extract`);
                    const { stdout: apkFiles } = await execAsync('find /tmp/zip_extract -name "*.apk"');
                    const list = apkFiles.split('\n').map(s => s.trim()).filter(Boolean);
                    let output = '';
                    for (const f of list) {
                      await execAsync(`docker cp "${f}" android-kvm:/tmp/install_part.apk`);
                      const { stdout } = await runAdb('install -r /tmp/install_part.apk');
                      output += stdout + '\n';
                    }
                    await execAsync('docker cp /tmp/zip_extract/. android-kvm:/sdcard/Download/').catch(() => {});
                    res.writeHead(200, { 'Content-Type': 'application/json' });
                    res.end(JSON.stringify({ ok: true, output: output || 'Extracted ZIP to /sdcard/Download' }));
                    return;
                  } else {
                    await execAsync(`curl -L -s -o /tmp/remote.apk "${apkUrl}"`);
                    await execAsync('docker cp /tmp/remote.apk android-kvm:/tmp/remote.apk');
                    const { stdout } = await runAdb('install -r /tmp/remote.apk');
                    res.writeHead(200, { 'Content-Type': 'application/json' });
                    res.end(JSON.stringify({ ok: true, output: stdout }));
                    return;
                  }
                }

                if (url.pathname === '/upload-package') {
                  const { fileName = 'upload.apk', fileBase64 } = payload;
                  if (!fileBase64) throw new Error('Missing fileBase64');
                  const cleanB64 = String(fileBase64).replace(/^data:[^;]+;base64,/, '');
                  const buf = Buffer.from(cleanB64, 'base64');
                  const isZip = String(fileName).toLowerCase().endsWith('.zip');
                  if (isZip) {
                    fs.writeFileSync('/tmp/upload_bundle.zip', buf);
                    await execAsync('rm -rf /tmp/zip_upload && mkdir -p /tmp/zip_upload && unzip -o /tmp/upload_bundle.zip -d /tmp/zip_upload');
                    const { stdout: apkFiles } = await execAsync('find /tmp/zip_upload -name "*.apk"');
                    const list = apkFiles.split('\n').map(s => s.trim()).filter(Boolean);
                    let output = '';
                    for (const f of list) {
                      await execAsync(`docker cp "${f}" android-kvm:/tmp/upload_part.apk`);
                      const { stdout } = await runAdb('install -r /tmp/upload_part.apk');
                      output += stdout + '\n';
                    }
                    await execAsync('docker cp /tmp/zip_upload/. android-kvm:/sdcard/Download/').catch(() => {});
                    res.writeHead(200, { 'Content-Type': 'application/json' });
                    res.end(JSON.stringify({
                      ok: true,
                      output: output || `Extracted ${fileName} to /sdcard/Download/`
                    }));
                    return;
                  } else {
                    fs.writeFileSync('/tmp/upload_direct.apk', buf);
                    await execAsync('docker cp /tmp/upload_direct.apk android-kvm:/tmp/upload_direct.apk');
                    const { stdout } = await runAdb('install -r /tmp/upload_direct.apk');
                    res.writeHead(200, { 'Content-Type': 'application/json' });
                    res.end(JSON.stringify({ ok: true, output: stdout }));
                    return;
                  }
                }

                if (url.pathname === '/shell') {
                  const safeCmd = String(payload.command || 'getprop ro.product.model');
                  const { stdout, stderr } = await runAdb(`shell ${JSON.stringify(safeCmd)}`);
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ ok: true, stdout, stderr }));
                  return;
                }

                if (url.pathname === '/packages') {
                  const { stdout } = await runAdb('shell pm list packages -3');
                  const packages = stdout
                    .split('\n')
                    .map(line => line.replace('package:', '').trim())
                    .filter(Boolean);
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ ok: true, packages }));
                  return;
                }

                if (url.pathname === '/launch') {
                  const pkg = String(payload.packageName || '').replace(/[^a-zA-Z0-9._]/g, '');
                  await runAdb(`shell monkey -p ${pkg} -c android.intent.category.LAUNCHER 1`);
                  setTimeout(captureNextFrame, 250);
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ ok: true }));
                  return;
                }
              }

              res.writeHead(404, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ error: 'Not found' }));
            } catch (e) {
              res.writeHead(500, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ ok: false, error: e.message }));
            }
          });

          server.listen(PORT, '0.0.0.0', () => {
            console.log('ADB HTTP Bridge v3 listening on', PORT);
          });
          EOF
          echo "pulling_android_image" > /tmp/droidcloud_stage.txt
          INITIAL_LAT="${{ github.event.inputs.initial_lat }}" INITIAL_LON="${{ github.event.inputs.initial_lon }}" nohup node adb_bridge.mjs > adb_bridge.log 2>&1 &

          echo "4. Starting Cloudflare Quick Tunnels (:6080 noVNC and :8081 ADB)..."
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:6080 > vnc_tunnel.log 2>&1 &
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8081 > adb_tunnel.log 2>&1 &
          sleep 5
          VNC_URL=""
          ADB_URL=""
          for i in {1..20}; do
            if [ -z "$VNC_URL" ]; then
              VNC_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' vnc_tunnel.log | head -n 1 || true)
            fi
            if [ -z "$ADB_URL" ]; then
              ADB_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' adb_tunnel.log | head -n 1 || true)
            fi
            if [ -n "$VNC_URL" ] && [ -n "$ADB_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "LIVE_NOVNC_URL=$VNC_URL"
          echo "LIVE_ADB_URL=$ADB_URL"

          JSON_PAYLOAD=$(jq -n \
            --arg sid "$SESSION_ID" \
            --arg vnc "$VNC_URL" \
            --arg adb "$ADB_URL" \
            --arg st "ready" \
            --arg runId "${{ github.run_id }}" \
            --arg ts "$(date +%s)" \
            '{sessionId: $sid, vncUrl: $vnc, adbUrl: $adb, status: $st, runId: $runId, updatedAt: ($ts | tonumber)}')
          B64_CONTENT=$(echo "$JSON_PAYLOAD" | base64 -w 0)
          EXISTING_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/live-session.json" | jq -r '.sha // empty')
          if [ -n "$EXISTING_SHA" ]; then
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/contents/live-session.json" \
              -d "{\"message\":\"Publish live KVM tunnels\",\"content\":\"$B64_CONTENT\",\"sha\":\"$EXISTING_SHA\"}" > /dev/null
          else
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/contents/live-session.json" \
              -d "{\"message\":\"Publish live KVM tunnels\",\"content\":\"$B64_CONTENT\"}" > /dev/null
          fi

      - name: Boot Docker-Android KVM, Restore Permanent Cache & Maintain Session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INIT_LAT: ${{ github.event.inputs.initial_lat }}
          INIT_LON: ${{ github.event.inputs.initial_lon }}
        run: |
          docker run -d \
            --privileged \
            --device /dev/kvm \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            -e SCREEN_WIDTH=1080 \
            -e SCREEN_HEIGHT=2340 \
            -p 6080:6080 \
            -p 5554:5554 \
            -p 5555:5555 \
            --name android-kvm \
            budtmo/docker-android:emulator_14.0

          echo "booting_android_os" > /tmp/droidcloud_stage.txt
          for i in {1..90}; do
            BOOT=$(docker exec android-kvm adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then
              echo "ready" > /tmp/droidcloud_stage.txt
              # Set fast 720x1600 (20:9 Vivo Y300 5G ratio) for 3x faster GPU & streaming speed
              docker exec android-kvm adb shell "wm size 720x1600 && wm density 300" || true
              docker exec android-kvm adb shell "svc power stayon true && settings put system screen_off_timeout 2147483647 && input keyevent 224 && input keyevent 82" || true
              docker exec android-kvm adb shell settings put global window_animation_scale 0 || true
              docker exec android-kvm adb shell settings put global transition_animation_scale 0 || true
              docker exec android-kvm adb shell settings put global animator_duration_scale 0 || true
              docker exec android-kvm adb shell "svc power stayon true" || true
              docker exec android-kvm adb shell input keyevent 82 || true
              break
            fi
            sleep 3
          done

          # 1. Restore saved GPS coordinates from persistent-cache.json (or inputs)
          CACHE_JSON=$(curl -s "https://raw.githubusercontent.com/$REPO/main/persistent-cache.json?t=$(date +%s)" || true)
          LAT_TO_SET="$INIT_LAT"
          LON_TO_SET="$INIT_LON"
          if echo "$CACHE_JSON" | jq -e '.gps.lat' >/dev/null 2>&1; then
            LAT_TO_SET=$(echo "$CACHE_JSON" | jq -r '.gps.lat')
            LON_TO_SET=$(echo "$CACHE_JSON" | jq -r '.gps.lon')
          fi
          echo "Applying permanent GPS coordinates: Lat=$LAT_TO_SET, Lon=$LON_TO_SET"
          docker exec android-kvm adb emu geo fix "$LON_TO_SET" "$LAT_TO_SET" 15 || true
          docker exec android-kvm adb shell "settings put secure location_mode 3" || true

          # 2. Restore /sdcard/ permanent backup if present in repo
          SD_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/sdcard-backup.tar.gz" | jq -r '.sha // empty')
          if [ -n "$SD_SHA" ]; then
            echo "Restoring permanent /sdcard/ user files from GitHub repo..."
            curl -L -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/$REPO/contents/sdcard-backup.tar.gz" -o /tmp/sdcard-backup.tar.gz
            docker cp /tmp/sdcard-backup.tar.gz android-kvm:/tmp/sdcard-backup.tar.gz
            docker exec android-kvm adb shell "tar -xzf /tmp/sdcard-backup.tar.gz -C / 2>/dev/null || true"
          fi

          # 3. Restore all pinned APKs
          RESTORE_APKS="${{ github.event.inputs.restore_apks }}"
          if [ -n "$RESTORE_APKS" ]; then
            for apk in $RESTORE_APKS; do
              echo "Restoring persistent APK: $apk"
              curl -L -s -o /tmp/restore.apk "$apk" && docker cp /tmp/restore.apk android-kvm:/tmp/restore.apk && docker exec android-kvm adb install -r /tmp/restore.apk || true
            done
          fi

          # 4. Continuous loop: periodically back up /sdcard/Download & /sdcard/DCIM to repo so changes are never lost!
          while true; do
            sleep 120
            docker exec android-kvm adb shell "tar -czf /tmp/sdcard-backup.tar.gz /sdcard/Download /sdcard/DCIM /sdcard/Pictures /sdcard/gps_location.json 2>/dev/null || true"
            docker cp android-kvm:/tmp/sdcard-backup.tar.gz /tmp/sdcard-backup.tar.gz 2>/dev/null || true
            if [ -f /tmp/sdcard-backup.tar.gz ]; then
              FILE_SIZE=$(stat -c%s /tmp/sdcard-backup.tar.gz 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 100 ] && [ "$FILE_SIZE" -lt 45000000 ]; then
                B64_SD=$(base64 -w 0 /tmp/sdcard-backup.tar.gz)
                OLD_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/sdcard-backup.tar.gz" | jq -r '.sha // empty')
                if [ -n "$OLD_SHA" ]; then
                  curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
                    "https://api.github.com/repos/$REPO/contents/sdcard-backup.tar.gz" \
                    -d "{\"message\":\"Auto-backup Android sdcard state\",\"content\":\"$B64_SD\",\"sha\":\"$OLD_SHA\"}" > /dev/null || true
                else
                  curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
                    "https://api.github.com/repos/$REPO/contents/sdcard-backup.tar.gz" \
                    -d "{\"message\":\"Create Android sdcard state backup\",\"content\":\"$B64_SD\"}" > /dev/null || true
                fi
              fi
            fi
          done
